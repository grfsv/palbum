services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: remind_map_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-remind_map}
      MYSQL_USER: ${MYSQL_USER:-remind_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-remind_password}
      TZ: Asia/Tokyo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - remind_map_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Go Application (開発環境)
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: remind_map_app
    restart: unless-stopped
    ports:
      - "8080:${PORT}"
    environment:
      - PORT=${PORT}
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT}
      - DB_USER=${MYSQL_USER:-remind_user}
      - DB_PASSWORD=${MYSQL_PASSWORD:-remind_password}
      - DB_NAME=${MYSQL_DATABASE:-remind_map}
      - GIN_MODE=${GIN_MODE:-debug}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY}
      - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
    volumes:
      - .:/app
      - go_modules:/go/pkg/mod
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - remind_map_network

volumes:
  mysql_data:
    driver: local
  go_modules:
    driver: local

networks:
  remind_map_network:
    driver: bridge
